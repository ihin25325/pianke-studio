name: Windows core tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core packages
        run: python -m pip install -r requirements.txt
      - name: Install media tools and default fonts
        run: python -B scripts/setup_core.py
      - name: Check release boundary
        run: python -B scripts/release_check.py
      - name: Run unit and integration tests
        env:
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s scripts -p "test_*.py" -v
      - name: Render synthetic offline demo
        env:
          PYTHONUTF8: '1'
        run: python -B scripts/demo.py --render
